# Static site (GitHub Pages from gh-pages); there is no build. This pipeline
# only guards the files themselves: no page or stylesheet may point at a local
# file that does not exist (hypervoid/HyperVoid-Website#2).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "gh-pages"

check:local-refs:
  image: node:26.7.0-trixie
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then base=$CI_MERGE_REQUEST_DIFF_BASE_SHA; else base=$(git rev-parse HEAD^1); fi
      bash scripts/check-new-missing-refs.sh "$base"

# No page may ship with an unfilled copy marker such as {{STAGE1_NAME}}
# (Curiosity-Corp/ignite-curiosity#17: copy waits for its approved source).
check:no-placeholders:
  image: node:26.7.0-trixie
  script:
    - |
      if grep -rnE '\{\{[A-Z0-9_]+\}\}' --include='*.html' .; then
        echo "ERROR: unfilled copy markers above" >&2; exit 1
      fi
      echo "OK: no unfilled copy markers"

# The site is a program of Curiosity Research Corporation (curiositycorp.org).
# No published file may bring back the previous owner attribution
# outside scripts/old-attribution-allowlist.txt (Curiosity-Corp/ignite-curiosity#18).
check:no-old-attribution:
  image: node:26.7.0-trixie
  script:
    - node scripts/check-old-attribution.mjs
    - node scripts/set-owner-attribution.mjs --check
    # Admiral decisions on #19 stay applied (GuideStar seal, See Usage link,
    # non-profit clause, old reCAPTCHA action, info/ template wording).
    - node scripts/apply-site-decisions.mjs --check

# sitemap.xml lists exactly the real pages on https://ignitecuriosity.org/
# (reachable from the home page, minus robots.txt rules) and robots.txt points
# at it (Curiosity-Corp/ignite-curiosity#19, decision 7).
check:sitemap:
  image: node:26.7.0-trixie
  script:
    - node scripts/build-sitemap.mjs --check

# People must be able to register and to contact us from the site
# (CEO order 2026-11-18, Curiosity-Corp/ignite-curiosity#20). Each page keeps a
# form that posts to an https address whose host resolves, and the register
# script that submits it is present.
check:forms-post-somewhere:
  image: node:26.7.0-trixie
  script:
    - node scripts/check-forms.mjs

# Every page in sitemap.xml meets the site standard: its own title, canonical link,
# sharing tags, schema.org data, one h1, a skip link, alt text, rel=noopener on
# new-tab links. A new or edited page that misses it fails here; the fix is to run
# the script.
check:page-standard:
  image: node:26.7.0-trixie
  script:
    - node scripts/strengthen-pages.mjs --check
